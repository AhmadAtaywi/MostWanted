<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard-style.css">
    <style>
        body{
    background-color:#495057;
}
    </style>
  
</head>
<body>
    <!-- Sidebar (Same Sidebar as the Dashboard) -->
    <div class="sidebar">
        <h3 class="text-center py-4">Admin Panel</h3>
        <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="cars.html"><i class="fas fa-car"></i> Cars</a>
        <a href="users.html"><i class="fas fa-users"></i> Users</a>
        <a href="bookings.html"><i class="fas fa-calendar-alt"></i> Bookings</a>
        <a href="settings.html"><i class="fas fa-cogs"></i> Settings</a>
    </div>

    <!-- Content -->
    
    <div class="content">
        <nav class="navbar navbar-expand-lg navbar-custom">
            <a class="navbar-brand" href="#">Settings</a>
        </nav>
        <h3 class="my-4">System Settings</h3>
        <form>
            <div class="mb-3">
                <label for="siteTitle" class="form-label">Site Title</label>
                <input type="text" class="form-control" id="siteTitle" value="Car Rental">
            </div>
            <div class="mb-3">
                <label for="adminEmail" class="form-label">Admin Email</label>
                <input type="email" class="form-control" id="adminEmail" value="admin@rental.com">
            </div>
            <button type="submit" class="btn button">Save Settings</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
