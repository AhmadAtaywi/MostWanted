
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard-style.css">
    <style>
        body{
    background-color:#495057;
}
    </style>
</head>
<body>
    <div class="sidebar">
        <h3 class="text-center py-4">Admin Panel</h3>
        <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="cars.html"><i class="fas fa-car"></i> Cars</a>
        <a href="users.html"><i class="fas fa-users"></i> Users</a>
        <a href="bookings.html"><i class="fas fa-calendar-alt"></i> Bookings</a>
        <a href="settings.html"><i class="fas fa-cogs"></i> Settings</a>
    </div>
   
    <div class="content">
        <nav class="navbar navbar-expand-lg navbar-custom">
            <a class="navbar-brand" href="#">Admin Dashboard</a>
            <div class="ml-auto"><span class="navbar-text">Hello, Admin</span></div>
        </nav>
        <div class="row">
            <div class="col-md-4"><div class="card card-stat shadow-sm"><div class="card-body"><h5 class="card-title">Total Cars</h5><p class="card-text">150</p></div></div></div>
            <div class="col-md-4"><div class="card card-stat shadow-sm"><div class="card-body"><h5 class="card-title">Total Users</h5><p class="card-text">320</p></div></div></div>
            <div class="col-md-4"><div class="card card-stat shadow-sm"><div class="card-body"><h5 class="card-title">Total Bookings</h5><p class="card-text">120</p></div></div></div>
        </div>
        <h3 class="my-4">Recent Bookings</h3>
        <table class="table  table-dark table-hover table-bordered shadow-sm">
            <thead><tr><th>#</th><th>User</th><th>Car</th><th>Date</th><th>Status</th></tr></thead>
            <tbody>
                <tr><td>1</td><td>John Doe</td><td>Toyota Corolla</td><td>2025-05-10</td><td><span class="badge bg-success">Confirmed</span></td></tr>
                <tr><td>2</td><td>Jane Smith</td><td>Honda Civic</td><td>2025-05-12</td><td><span class="badge bg-warning">Pending</span></td></tr>
            </tbody>
        </table>
    </div>
   
</body>
</html>
